name: Pull request check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel a superseded run when a branch is pushed again (amend/force-push), so an
# amend-heavy session doesn't leave a trail of full runs burning to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One sequential job, not a 5-way matrix: a matrix is five runners each repeating
  # checkout + setup + install, five times the per-run overhead for a small project.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm check
      - run: pnpm build
      - run: pnpm security-audit

      # Cache the browser binary so the vitest browser project doesn't re-download it each run.
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:coverage
